#:schema https://mago.carthage.software/1.47.3/schema.json
# Welcome to Mago!
# For full documentation, see https://mago.carthage.software/1.47.3/en/tools/overview/
version = "1"
php-version = "8.3.0"

[source]
workspace = "."
paths = ["src/", "tests/"]
includes = ["vendor"]
excludes = []

[source.glob]
literal-separator = true

[formatter]
preset = "psr-12"
# Expected output of the builder generator, must match it byte by byte
excludes = ["tests/Examples/Generator/SampleClassBuilder.php"]

[linter]
integrations = ["symfony", "phpunit"]

[linter.rules]
ambiguous-function-call = { enabled = false }
literal-named-argument = { enabled = false }
halstead = { effort-threshold = 5000 }
# Builders override build()/cloneLast() only to narrow the return type
no-redundant-method-override = { enabled = false }

[analyzer]
plugins = []
find-unused-definitions = true
find-unused-expressions = true
analyze-dead-code = false
memoize-properties = true
check-throws = true
unchecked-exceptions = ["Error", "LogicException"]
unchecked-exception-classes = []
check-missing-override = true
find-unused-parameters = true
strict-list-index-checks = true
strict-array-index-existence = false
allow-array-truthy-operand = false
no-boolean-literal-comparison = false
check-missing-type-hints = false
register-super-globals = true
